# Lokalne zależności do developmentu i testów integracyjnych:
# docker compose -f infra/docker-compose.dev.yml up -d
name: portal-dev

services:
  mysql:
    image: mysql:8.4
    # 20.11.2026 (skill vps-optymalizacja): baza dev ma ~2 MB danych — performance_schema i bufor 128M
    # trzymały ~430 MB RAM+swap na VPS. Kontener stoi zatrzymany; przed testem: docker start portal-dev-mysql-1.
    # UWAGA: usługa nie ma nazwanego wolumenu — `up -d` po tej zmianie ODTWORZY kontener z pustą bazą.
    command: ['--performance-schema=OFF', '--innodb-buffer-pool-size=64M']
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uportal', '-pportal']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
