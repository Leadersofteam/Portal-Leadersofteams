# Produkcja — osobny projekt compose na współdzielonym VPS (ADR-005).
# Uruchamianie: docker compose -p portal --env-file /opt/portal/.env -f docker-compose.yml up -d
# Wymaga istniejącej zewnętrznej sieci `traefik_public` (patrz bootstrap.sh).
#
# Obrazy: domyślnie z GHCR (CI ustawia WEB_IMAGE/API_IMAGE). Wariant 0 zł
# build-on-VPS (ADR-009): docker compose build, gdy zmienne nie są ustawione.

name: portal

services:
  web:
    image: ${WEB_IMAGE:-portal-web:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, traefik_public]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    # Ten sam wzorzec co na stagingu (GO-LIVE-CHECKLIST §1). Do S12 prod `web`
    # nie miał sondy w ogóle: kontener z zawieszonym Next.js pokazywał „Up",
    # a Traefik dalej kierował do niego ruch.
    #
    # ⚠️ Sonda MUSI iść w `/healthz`, nie w `/` (S18). Do 14.08 uderzała w `/`
    # i była LICZONA JAKO ODSŁONA — 3926 sztucznych wejść na dobę przy 2–3
    # realnych na każdej innej stronie. `/healthz` jest wykluczone z matchera
    # middleware, więc nie dolicza się do niczego.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.portal-web.rule=Host(`leadersofteams.pl`) || Host(`www.leadersofteams.pl`)
      - traefik.http.routers.portal-web.entrypoints=websecure
      - traefik.http.routers.portal-web.tls.certresolver=letsencrypt
      - traefik.http.services.portal-web.loadbalancer.server.port=3000

  api:
    image: ${API_IMAGE:-portal-api:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: mysql://portal:${MYSQL_PASSWORD}@mysql:3306/portal
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: '604800'
      LOG_LEVEL: info
      APP_BASE_URL: ${APP_BASE_URL:-https://leadersofteams.pl}
      # E-mail (D4) — 0 zł (ADR-009). Domyślnie WŁASNA SKRZYNKA przez SMTP (ta sama,
      # której używa App), a nie zewnętrzny dostawca. Puste = tryb no-op.
      # ⚠️ MAIL_FROM musi być adresem UWIERZYTELNIONEJ skrzynki: nadawca z innej
      # domeny nie przejdzie SPF/DMARC i zostanie odrzucony albo wpadnie w spam.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@leadersofteams.pl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Leaders of Teams}
      UPLOADS_DIR: /app/uploads
    volumes:
      - portal_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, traefik_public]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.portal-api.rule=Host(`api.leadersofteams.pl`)
      - traefik.http.routers.portal-api.entrypoints=websecure
      - traefik.http.routers.portal-api.tls.certresolver=letsencrypt
      - traefik.http.services.portal-api.loadbalancer.server.port=3001

  worker:
    image: ${API_IMAGE:-portal-api:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://portal:${MYSQL_PASSWORD}@mysql:3306/portal
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      APP_BASE_URL: ${APP_BASE_URL:-https://leadersofteams.pl}
      # Worker wysyła własne maile (digest) — konfiguracja MUSI być identyczna
      # jak w api, inaczej „działa przy rejestracji, milczy w tle".
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@leadersofteams.pl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Leaders of Teams}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    # Worker nie ma portu HTTP, więc sonda `fetch` jak w api/web nie ma zastosowania.
    # Dowodem życia jest świeży klucz w Redisie, odnawiany TYLKO gdy pętla dispatchera
    # faktycznie się obraca (patrz apps/api/src/shared/heartbeat.ts). Bez tego cicha
    # śmierć workera nie dawała ŻADNEGO sygnału: `docker ps` pokazywał „Up", a wpisy
    # przestawały pojawiać się w feedzie i punkty przestawały dojrzewać.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const R=require(''ioredis'');const r=new R(process.env.REDIS_URL);r.get(''portal:worker:heartbeat'').then(v=>{r.disconnect();process.exit(v?0:1)}).catch(()=>{r.disconnect();process.exit(1)})"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Jednorazowe migracje (krok release'u, ADR-008):
  # docker compose -p portal run --rm migrate
  migrate:
    image: ${API_IMAGE:-portal-api:local}
    profiles: [tools]
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: mysql://portal:${MYSQL_PASSWORD}@mysql:3306/portal
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - portal_mysql_data:/var/lib/mysql
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uportal', '-p${MYSQL_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - portal_redis_data:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  internal:
  traefik_public:
    external: true

volumes:
  portal_mysql_data:
  portal_redis_data:
  # Pliki użytkowników (moduł files) — objąć backupem razem z bazą.
  portal_uploads:
