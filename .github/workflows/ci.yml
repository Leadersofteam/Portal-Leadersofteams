name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uportal -pportal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: mysql://portal:portal@127.0.0.1:3306/portal
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile

      - name: Generowanie klienta Prisma
        run: pnpm --filter @lot/api prisma:generate

      - name: Lint (w tym granice modułów — ADR-002)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Schemat → baza testowa
        run: pnpm --filter @lot/api exec prisma db push --skip-generate

      - name: Testy (unit + integracyjne)
        run: pnpm test

      - name: Build
        run: pnpm build

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Bezpośrednio CLI (MIT) zamiast gitleaks-action, która dla organizacji
      # wymaga płatnej licencji (polityka 0 zł — ADR-009).
      - name: Skan sekretów
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact --exit-code 1
